name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an Actions
  # incident and pull_request events stopped starting workflows at all — dispatch
  # goes through the API instead and is unaffected. Useful beyond the outage too:
  # re-running CI no longer needs an empty commit.
  workflow_dispatch:

# Least privilege: the build/test job only needs to read the repo.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never cancel a
# push to main, or that commit is left with a permanently "cancelled" status (masking
# breakage and putting holes in CI-status bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, Test & Package
    runs-on: macos-26
    timeout-minutes: 30   # a wedged build shouldn't burn the 6h default job limit
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag like @v4 can be
      # repointed at tampered code after the fact, a commit SHA cannot. Same
      # pin-and-verify discipline zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here runs git after checkout

      # License statements must agree with LICENSE (the Unlicense), and the bundle
      # identity with the fleet's ch.lkmc.* namespace — before paying for a build.
      - name: Check license statements and bundle identity
        run: |
          grep -q '^## License$' README.md || { echo "::error::README.md lacks its '## License' section"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' Info.plist)" = 'Public domain (Unlicense)' \
            || { echo "::error::Info.plist NSHumanReadableCopyright must be 'Public domain (Unlicense)'"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Info.plist)" = 'ch.lkmc.HallPass' \
            || { echo "::error::Info.plist CFBundleIdentifier must be 'ch.lkmc.HallPass'"; exit 1; }

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'   # pin so a runner-image bump can't change the toolchain

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Same invocation release.yml uses, so the release path is exercised on
      # every change rather than first failing under a tag.
      - name: Assemble HallPass.app (universal)
        run: ./scripts/build-app.sh --universal

      - name: Check the built app
        run: |
          APP=dist/HallPass.app
          BIN="$APP/Contents/MacOS/HallPass"
          test -x "$BIN" || { echo "::error::$BIN missing or not executable"; exit 1; }
          lipo -info "$BIN" | grep -q 'arm64.*x86_64\|x86_64.*arm64' \
            || { echo "::error::$BIN is not a universal arm64+x86_64 binary"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'ch.lkmc.HallPass' \
            || { echo "::error::built app lost its bundle identifier"; exit 1; }
          test -f "$APP/Contents/Resources/HallPass.icns" \
            || { echo "::error::built app lacks its icon"; exit 1; }
          codesign --verify --deep --strict "$APP" \
            || { echo "::error::ad-hoc signature failed verification — the app would not launch"; exit 1; }
